<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle - Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #008080; font-family: 'Chakra Petch', sans-serif; }
        .font-pixel { font-family: 'VT323', monospace; }
        .retro-window { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080; }
        .retro-btn { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; cursor: pointer; }
        .retro-btn:active { border-top: 2px solid #000000; border-left: 2px solid #000000; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; padding-top: 2px; padding-left: 2px; }
        .retro-titlebar { background-color: #0000aa; color: white; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .retro-content { background-color: white; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; }
        @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .turtle-roll { display: inline-block; transition: all 0.3s; }
        .turtle-roll:hover { animation: roll 1s linear infinite; cursor: pointer; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden relative">

    <!-- 📍 พื้นที่รองรับ Components ที่เราแยกไฟล์ไว้ -->
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <div id="cart-modal-container"></div>

    <main class="p-4 mt-4 max-w-6xl mx-auto">
        <div class="retro-window">
            <div class="retro-titlebar"><span id="window-title" class="font-pixel text-xl tracking-widest">Shop_All.exe</span></div>
            <div class="retro-content p-6 m-2 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                <div class="flex justify-between items-end border-b-4 border-black pb-2 mb-6">
                    <h1 id="page-title" class="text-4xl font-bold font-pixel text-blue-800 drop-shadow-md">SHOP ALL</h1>
                    <span id="item-count" class="font-bold bg-yellow-400 px-2 border-2 border-black">Loading...</span>
                </div>
                <div id="product-container" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="col-span-1 md:col-span-4 text-center py-10 bg-white border-2 border-dashed border-gray-400">
                        <p class="text-lg font-bold text-gray-700 animate-pulse">กำลังโหลดรายการสินค้า...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal สินค้า -->
    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black opacity-60" onclick="closeModal('product-modal')"></div>
        <div class="retro-window w-11/12 md:w-3/4 lg:w-1/2 max-h-[90vh] overflow-y-auto relative z-10 flex flex-col">
            <div class="retro-titlebar"><span id="modal-title" class="font-pixel text-xl tracking-widest">Product.exe</span><button onclick="closeModal('product-modal')" class="retro-btn bg-red-500 text-white px-2 py-0 font-bold hover:bg-red-400">X</button></div>
            <div class="retro-content p-4 m-2 flex-1 bg-white">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- รูปภาพซ้ายมือ -->
                    <div class="space-y-2">
                        <div class="bg-gray-100 border-2 border-gray-300 h-64 flex justify-center overflow-hidden relative group cursor-pointer" onclick="document.getElementById('modal-img').click()">
                            <img id="modal-img" src="" class="object-cover h-full">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 flex items-center justify-center transition-all pointer-events-none">
                                <span class="text-white opacity-0 group-hover:opacity-100 font-bold bg-black bg-opacity-50 px-2 py-1 rounded">🔍 Zoom</span>
                            </div>
                        </div>
                        <div id="modal-thumbnails" class="flex justify-center space-x-2 p-1"></div>
                        <div id="modal-desc-box" class="bg-gray-100 border-2 border-dashed border-gray-300 p-1 hidden">
                            <p class="text-xs font-bold text-center bg-yellow-200 mb-1 cursor-pointer" onclick="document.getElementById('modal-desc-img').click()">Details (🔍 Click to Zoom)</p>
                            <img id="modal-desc-img" src="" class="w-full object-contain cursor-pointer hover:opacity-80 transition-opacity">
                        </div>
                    </div>
                    
                    <!-- ข้อมูลขวามือ -->
                    <div class="flex flex-col space-y-4">
                        <h2 id="modal-name" class="text-3xl font-pixel font-bold text-blue-800 uppercase"></h2>
                        <p id="modal-price" class="text-2xl font-pixel text-red-600 font-bold" data-thb="0"></p>
                        <div class="h-px w-full bg-black"></div>
                        <div><label class="font-bold text-sm block mb-1">SELECT COLOR:</label><select id="modal-color" class="retro-content w-full p-2 font-bold cursor-pointer"></select></div>
                        <div><label class="font-bold text-sm block mb-1">SELECT SIZE:</label><select id="modal-size" class="retro-content w-full p-2 font-bold cursor-pointer"></select></div>
                        <div class="mt-auto pt-4">
                            <button id="add-cart-btn" onclick="addToCart()" class="retro-btn w-full bg-yellow-400 hover:bg-yellow-300 font-bold text-lg py-3 flex justify-center items-center space-x-2">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                <span>ADD TO CART</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔍 Modal สำหรับ Zoom ดูรูปเต็มจอ -->
    <div id="zoom-modal" class="fixed inset-0 z-[60] flex items-center justify-center hidden bg-black bg-opacity-80 backdrop-blur-sm" onclick="closeModal('zoom-modal')">
        <button class="absolute top-4 right-4 text-white font-pixel text-4xl hover:text-red-500 cursor-pointer">&times;</button>
        <img id="zoomed-img" src="" class="max-w-[95vw] max-h-[95vh] object-contain border-4 border-white shadow-2xl">
    </div>

    <script>
        let currentLang = 'EN';
        const exchangeRate = 35; 

        function toggleLanguage() {
            currentLang = currentLang === 'EN' ? 'TH' : 'EN';
            const langBtn = document.getElementById('lang-btn');
            if(langBtn) langBtn.innerText = currentLang === 'EN' ? 'EN / $' : 'TH / ฿';
            
            const langHome = document.querySelector('.lang-home');
            if(langHome) langHome.innerText = currentLang === 'EN' ? 'Home' : 'หน้าแรก';
            
            const langShop = document.querySelector('.lang-shop');
            if(langShop) langShop.innerText = currentLang === 'EN' ? 'Shop all' : 'สินค้าทั้งหมด';
            
            const langContact = document.querySelector('.lang-contact');
            if(langContact) langContact.innerText = currentLang === 'EN' ? 'Contact' : 'ติดต่อเรา';
            
            if(typeof renderShopProducts === 'function') renderShopProducts();
            updateCartCount();
            if(document.getElementById('cart-modal') && !document.getElementById('cart-modal').classList.contains('hidden')) renderCart();
        }

        function formatPrice(thbPrice) {
            if (currentLang === 'EN') return '$' + (thbPrice / exchangeRate).toFixed(2);
            return '฿' + thbPrice;
        }

        let cart = JSON.parse(localStorage.getItem('turtle_cart')) || [];
        function updateCartCount() {
            const countEl = document.getElementById('cart-count');
            if(countEl) countEl.innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            localStorage.setItem('turtle_cart', JSON.stringify(cart));
        }

        function addToCart() {
            const name = document.getElementById('modal-name').innerText;
            const price = parseInt(document.getElementById('modal-price').getAttribute('data-thb'));
            const color = document.getElementById('modal-color').value;
            const size = document.getElementById('modal-size').value;
            const image = document.getElementById('modal-img').src;
            const existing = cart.find(i => i.name === name && i.color === color && i.size === size);
            if (existing) existing.qty += 1; else cart.push({ name, price, color, size, image, qty: 1 });
            updateCartCount(); closeModal('product-modal'); alert(`Added to Cart!`);
        }

        function openCart() { renderCart(); document.getElementById('cart-modal').classList.remove('hidden'); }

        const API_URL_BASE = 'https://script.google.com/macros/s/AKfycbzddCdtxB9XxVntW4SMvCrrT9p-TzizEesL6PZF5Krejw2QcZsW4HrXpfjJogq4d4FjdA/exec';
        
        let globalGroupedProducts = {}; 
        let shipmentRates = [];
        let productType = new URLSearchParams(window.location.search).get('type');

        if(productType) {
            document.getElementById('window-title').innerText = `Category_${productType}.exe`;
            document.getElementById('page-title').innerText = productType.toUpperCase();
        }

        async function initApp() {
            try {
                let jsonProd, jsonShip;
                const cachedProducts = sessionStorage.getItem('turtle_products');
                const cachedShipment = sessionStorage.getItem('turtle_shipment');

                if (cachedProducts && cachedShipment) {
                    jsonProd = JSON.parse(cachedProducts);
                    jsonShip = JSON.parse(cachedShipment);
                } else {
                    const resProd = await fetch(API_URL_BASE + '?action=getProducts');
                    jsonProd = await resProd.json();
                    const resShip = await fetch(API_URL_BASE + '?action=getShipment');
                    jsonShip = await resShip.json();
                    sessionStorage.setItem('turtle_products', JSON.stringify(jsonProd));
                    sessionStorage.setItem('turtle_shipment', JSON.stringify(jsonShip));
                }
                
                shipmentRates = jsonShip.data || [];
                const countrySelect = document.getElementById('cust-country');
                if(countrySelect) {
                    shipmentRates.forEach(rate => { countrySelect.innerHTML += `<option value="${rate.countryEN}">${rate.countryEN} / ${rate.countryTH}</option>`; });
                }

                if (jsonProd.status === 'success') {
                    let filteredProducts = jsonProd.data;
                    if (productType) {
                        filteredProducts = jsonProd.data.filter(item => item.type && item.type.toLowerCase() === productType.toLowerCase());
                    }

                    const groups = {};
                    filteredProducts.forEach(p => {
                        let nameKey = p.name.trim().toUpperCase();
                        if(nameKey === 'WOOL - EYES') nameKey = 'WOOL-EYES';
                        
                        if(!groups[nameKey]) {
                            groups[nameKey] = {
                                name: p.name, 
                                image: (p.images && p.images[1]) ? p.images[1] : p.image, 
                                hoverImage: p.image,
                                descImage: (p.images && p.images[2]) ? p.images[2] : '', 
                                price: p.price,
                                stock: 0, 
                                colors: new Set(), 
                                sizes: new Set(),
                                colorData: {} 
                            };
                        }
                        groups[nameKey].stock += (p.stock || 0);
                        groups[nameKey].colors.add(p.color);
                        groups[nameKey].sizes.add(p.size);
                        
                        if (!groups[nameKey].colorData[p.color]) {
                            groups[nameKey].colorData[p.color] = {
                                imgL: (p.images && p.images[1]) ? p.images[1] : p.image,
                                imgA: p.image
                            };
                        }
                    });
                    globalGroupedProducts = groups;
                    renderShopProducts();
                }
            } catch (err) {
                console.error("Error loading app:", err);
            }
            updateCartCount();
        }

        function renderShopProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; 
            const keys = Object.keys(globalGroupedProducts);
            document.getElementById('item-count').innerText = `Items found: ${keys.length}`;
            
            if(keys.length === 0) {
                container.innerHTML = `<div class="col-span-4 text-center p-10 font-bold bg-white border-2 border-black">ไม่พบสินค้าในหมวดหมู่นี้</div>`;
                return;
            }

            keys.forEach(key => {
                const group = globalGroupedProducts[key];
                const isOutOfStock = group.stock <= 0;
                const btnClass = isOutOfStock ? "bg-gray-400 text-gray-700 cursor-not-allowed" : "bg-yellow-400 hover:bg-yellow-300";
                const btnText = isOutOfStock ? "OUT OF STOCK" : "VIEW DETAILS";

                container.innerHTML += `
                    <div onclick="${isOutOfStock ? '' : `openProductModal('${key}')`}" class="retro-window p-2 bg-white flex flex-col items-center hover:scale-105 transition-transform ${isOutOfStock ? '' : 'cursor-pointer'}">
                        <div class="retro-content w-full p-1 mb-2 bg-gray-100 flex justify-center h-48 overflow-hidden relative">
                            <img src="${group.image}" loading="lazy" onmouseover="this.src='${group.hoverImage}'" onmouseout="this.src='${group.image}'" class="object-cover h-full transition-opacity duration-300">
                            ${isOutOfStock ? '<div class="absolute inset-0 bg-white bg-opacity-70 flex items-center justify-center font-bold text-red-600 border-4 border-red-600 transform -rotate-12 text-xl">SOLD OUT</div>' : ''}
                        </div>
                        <h3 class="font-bold text-xl text-blue-800 font-pixel tracking-wide text-center uppercase">${group.name}</h3>
                        <div class="w-full bg-black h-px my-2"></div>
                        <p class="font-pixel text-xl text-red-600 font-bold mb-2">${formatPrice(group.price)}</p>
                        <button class="retro-btn font-bold px-2 py-1 w-full text-sm ${btnClass}" ${isOutOfStock ? 'disabled' : ''}>${btnText}</button>
                    </div>`;
            });
        }

        function openZoomModal(src) {
            if(!src) return;
            document.getElementById('zoomed-img').src = src;
            document.getElementById('zoom-modal').classList.remove('hidden');
        }

        function updateModalImages(colorName) {
            const group = window.currentModalGroup;
            if(!group || !group.colorData[colorName]) return;
            
            const cData = group.colorData[colorName];
            const mainImg = document.getElementById('modal-img');
            
            mainImg.src = cData.imgL || cData.imgA;
            mainImg.setAttribute('onclick', `openZoomModal(this.src)`);
            
            document.getElementById('modal-thumbnails').innerHTML = `
                <img src="${cData.imgL}" loading="lazy" onclick="document.getElementById('modal-img').src=this.src" class="w-14 h-14 object-cover border border-gray-400 cursor-pointer hover:opacity-80">
                <img src="${cData.imgA}" loading="lazy" onclick="document.getElementById('modal-img').src=this.src" class="w-14 h-14 object-cover border border-gray-400 cursor-pointer hover:opacity-80">
            `;
        }

        function openProductModal(nameKey) {
            const group = globalGroupedProducts[nameKey];
            if(!group) return;
            
            document.getElementById('modal-name').innerText = group.name; 
            document.getElementById('modal-price').innerText = formatPrice(group.price);
            document.getElementById('modal-price').setAttribute('data-thb', group.price); 
            
            const descBox = document.getElementById('modal-desc-box');
            if(group.descImage) { 
                document.getElementById('modal-desc-img').src = group.descImage; 
                document.getElementById('modal-desc-img').setAttribute('onclick', `openZoomModal('${group.descImage}')`);
                descBox.classList.remove('hidden'); 
            } else {
                descBox.classList.add('hidden'); 
            }
            
            const colorSelect = document.getElementById('modal-color');
            colorSelect.innerHTML = Array.from(group.colors).map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('modal-size').innerHTML = Array.from(group.sizes).map(s => `<option value="${s}">${s}</option>`).join('');
            
            window.currentModalGroup = group;
            
            if(group.colors.size > 0) {
                updateModalImages(colorSelect.value);
            }
            colorSelect.onchange = function() { updateModalImages(this.value); };

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            let subtotalTHB = 0;
            if(cart.length === 0) cartItemsDiv.innerHTML = '<p class="text-gray-500 text-sm">Cart is empty.</p>';
            else {
                cart.forEach((item, index) => {
                    subtotalTHB += (item.price * item.qty);
                    cartItemsDiv.innerHTML += `
                        <div class="flex items-center space-x-2 text-xs border-b border-gray-300 pb-1">
                            <img src="${item.image}" class="w-10 h-10 object-cover border border-black">
                            <div class="flex-1">
                                <p class="font-bold">${item.name} <span class="text-red-500 cursor-pointer text-xs" onclick="removeItem(${index})">[x]</span></p>
                                <p class="text-gray-600">${item.color} | ${item.size} x${item.qty}</p>
                            </div>
                            <div class="font-bold">${formatPrice(item.price * item.qty)}</div>
                        </div>`;
                });
            }
            document.getElementById('cart-subtotal').innerText = formatPrice(subtotalTHB);
            document.getElementById('cart-subtotal').setAttribute('data-thb', subtotalTHB);
            calculateShipping();
        }
        function removeItem(index) { cart.splice(index, 1); updateCartCount(); renderCart(); }

        // 📍 ฟังก์ชันนี้ไว้รับค่าจาก Radio Button ของ Payment Method ตัวใหม่
        function updatePaymentMethod(radio) {
            document.getElementById('payment-method').value = radio.value;
            calculateShipping(); 
        }

        function calculateShipping() {
            const selectedCountry = document.getElementById('cust-country').value;
            const subtotalTHB = parseInt(document.getElementById('cart-subtotal').getAttribute('data-thb')) || 0;
            const rateInfo = shipmentRates.find(r => r.countryEN === selectedCountry);
            const paymentMethod = document.getElementById('payment-method').value;
            let finalFeeTHB = 0;
            let conditionText = "";

            if (rateInfo) {
                finalFeeTHB = rateInfo.fee; 
                document.getElementById('ship-platform').innerText = rateInfo.platform;
                
                conditionText = rateInfo.condition;
                const numberMatch = rateInfo.condition.match(/\d+/); 
                
                if (numberMatch) {
                    const conditionAmount = parseInt(numberMatch[0]);
                    if (currentLang === 'EN') {
                        const usdAmt = (conditionAmount / exchangeRate).toFixed(2);
                        conditionText = conditionText.replace(numberMatch[0], '$' + usdAmt);
                    } else {
                        conditionText = conditionText.replace(numberMatch[0], '฿' + conditionAmount);
                    }

                    if (selectedCountry.toLowerCase() === 'thailand') {
                        if (rateInfo.condition.includes('<')) { 
                            if (subtotalTHB >= conditionAmount) finalFeeTHB = 0; 
                        } else if (subtotalTHB >= conditionAmount) { 
                            finalFeeTHB = 0; 
                        }
                    }
                }
                document.getElementById('ship-cond').innerText = `(${conditionText})`;
            }
            
            document.getElementById('ship-fee').innerText = formatPrice(finalFeeTHB);
            document.getElementById('grand-total').innerText = formatPrice(subtotalTHB + finalFeeTHB);

            const payBox = document.getElementById('payment-info-box');
            const slipBox = document.getElementById('slip-upload-box');
            
            if (paymentMethod === 'Payso') {
                payBox.innerHTML = `
                    <p class="text-sm font-bold text-blue-800">Secure Online Payment</p>
                    <p class="text-xs mt-2 text-gray-600">ระบบจะพาคุณไปยังหน้าชำระเงินออนไลน์ (รับบัตรเครดิต, PayPal, Alipay และอื่นๆ) หลังจากกด PLACE ORDER_</p>
                `;
                slipBox.classList.add('hidden'); // ซ่อนอัปโหลดสลิป
            } else {
                if(selectedCountry.toLowerCase() === 'thailand') {
                    payBox.innerHTML = `
                        <p class="text-sm font-bold text-blue-800">PromptPay QR Code</p>
                        <img src="https://i.postimg.cc/YSD8w90Y/7763E006-D927-4A3E-BC60-D7904417EB1E.jpg" class="w-48 h-48 mx-auto my-2 border-2 border-black object-contain p-1 bg-white">
                        <p class="text-xs">Scan to pay <b class="text-red-600 text-lg">฿${subtotalTHB + finalFeeTHB}</b></p>
                    `;
                } else {
                    payBox.innerHTML = `
                        <p class="text-sm font-bold text-blue-800 mb-1 border-b border-blue-300 pb-1">International Bank Transfer</p>
                        <div class="text-left text-xs space-y-1 mt-2">
                            <p><b>Bank:</b> Kasikornbank (KBank)</p>
                            <p><b>Name:</b> Kairin Satjawiso</p>
                            <p><b>Account No:</b> 236-188167-5</p>
                            <p><b>SWIFT:</b> KASITHBK</p>
                            <p class="text-red-600 mt-2">*Import taxes in your country are the buyer's responsibility.</p>
                        </div>
                    `;
                }
                slipBox.classList.remove('hidden'); // โชว์อัปโหลดสลิป
            }
            
            if(cart.length > 0) { payBox.classList.remove('hidden'); } 
            else { payBox.classList.add('hidden'); slipBox.classList.add('hidden'); }
        }

        let currentSlipBase64 = '';
        function previewSlip(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('slip-preview').src = e.target.result;
                document.getElementById('slip-preview').classList.remove('hidden');
                currentSlipBase64 = e.target.result; 
            };
            reader.readAsDataURL(file);
        }

        async function placeOrder() {
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const phone = document.getElementById('cust-phone').value;
            const addr = document.getElementById('cust-addr').value;
            const country = document.getElementById('cust-country').value;
            const paymentMethod = document.getElementById('payment-method').value;
            
            if(!name || !email || !addr || !phone) { alert("Please enter Name, Email, Phone, and Address."); return; }
            if(cart.length === 0) { alert("Cart is empty."); return; }
            if(paymentMethod === 'Manual' && !currentSlipBase64) { 
                alert("Please attach your payment receipt / slip."); return; 
            }

            const subtotal = parseInt(document.getElementById('cart-subtotal').getAttribute('data-thb'));
            const rateInfo = shipmentRates.find(r => r.countryEN === country);
            let shipFee = rateInfo ? rateInfo.fee : 0;
            if(rateInfo) {
                const numMatch = rateInfo.condition.match(/\d+/);
                if (numMatch) {
                    const condAmt = parseInt(numMatch[0]);
                    if (country.toLowerCase() === 'thailand') {
                        if (rateInfo.condition.includes('<')) { if (subtotal >= condAmt) shipFee = 0; } 
                        else if (subtotal >= condAmt) { shipFee = 0; }
                    } else {
                        if (subtotal < condAmt) {
                            let alertMsg = currentLang === 'EN' 
                                ? `System message: International shipping requires a minimum order of $${(condAmt / exchangeRate).toFixed(2)}. Please add more items to your cart. 🐢`
                                : `System message: จัดส่งต่างประเทศต้องมียอดสั่งซื้อขั้นต่ำ ฿${condAmt} กรุณาเพิ่มสินค้าลงตะกร้า 🐢`;
                            alert(alertMsg);
                            return; 
                        }
                    }
                }
            }

            const payload = {
                action: 'checkout', customerName: name, customerEmail: email, address: addr, country: country, phone: phone,
                shippingPlatform: document.getElementById('ship-platform').innerText, subtotal: subtotal,
                shippingFee: shipFee, grandTotal: subtotal + shipFee, 
                paymentMethod: paymentMethod === 'Payso' ? 'Paysolutions' : 'Manual Transfer', 
                slipBase64: paymentMethod === 'Payso' ? "-" : currentSlipBase64, items: cart
            };

            const btn = document.getElementById('place-order-btn');
            btn.innerText = "PROCESSING..."; btn.disabled = true;

            try {
                const response = await fetch(API_URL_BASE, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const result = await response.json();
                
                if(result.status === 'success') {
                    if (paymentMethod === 'Payso') {
                        btn.innerText = "REDIRECTING TO PAYMENT...";
                        const paysoForm = document.createElement('form');
                        paysoForm.method = 'post';
                        paysoForm.action = 'https://payments.paysolutions.asia/payment';
                        
                        const paysoData = {
                            merchantid: '72854232', 
                            refno: result.message,  
                            customeremail: result.email,
                            productdetail: 'Turning Turtle Order',
                            total: result.total,
                            cc: '00',
                            lang: 'TH'
                        };
                        
                        for (const key in paysoData) {
                            const hiddenField = document.createElement('input');
                            hiddenField.type = 'hidden';
                            hiddenField.name = key;
                            hiddenField.value = paysoData[key];
                            paysoForm.appendChild(hiddenField);
                        }
                        
                        document.body.appendChild(paysoForm);
                        cart = []; updateCartCount();
                        closeModal('cart-modal');
                        paysoForm.submit();
                        return; 
                    }
                    
                    alert(`Order Placed Successfully!\nYour Order ID: ${result.message}`);
                    cart = []; updateCartCount();
                    
                    document.getElementById('cust-name').value = ''; document.getElementById('cust-email').value = ''; 
                    document.getElementById('cust-phone').value = ''; document.getElementById('cust-addr').value = ''; 
                    document.getElementById('slip-file').value = ''; document.getElementById('slip-preview').classList.add('hidden'); 
                    currentSlipBase64 = '';
                    closeModal('cart-modal');
                } else alert("Error: " + result.message);
            } catch(e) { alert("Connection Error."); }
            btn.innerText = "PLACE ORDER_"; btn.disabled = false;
        }

        // 📍 ฟังก์ชันผูก Event ให้เมนู
        function bindSidebarEvents() {
            const menuBtn = document.getElementById('menu-btn');
            const closeBtn = document.getElementById('close-btn');
            const overlay = document.getElementById('overlay');
            const sidebar = document.getElementById('sidebar');
            const shopDropdownBtn = document.getElementById('shop-dropdown-btn');

            if(menuBtn) menuBtn.addEventListener('click', () => { sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden'); });
            
            const closeSidebar = () => { sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden'); };
            if(closeBtn) closeBtn.addEventListener('click', closeSidebar); 
            if(overlay) overlay.addEventListener('click', closeSidebar);
            
            if(shopDropdownBtn) shopDropdownBtn.addEventListener('click', () => { document.getElementById('shop-submenu').classList.toggle('hidden'); });
        }

        // 📍 ฟังก์ชันดึงชิ้นส่วนมาประกอบร่าง
        async function loadComponents() {
            try {
                const [headerRes, sidebarRes, cartRes] = await Promise.all([
                    fetch('header.html'),
                    fetch('sidebar.html'),
                    fetch('cart-modal.html')
                ]);
                
                document.getElementById('header-container').innerHTML = await headerRes.text();
                document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();
                document.getElementById('cart-modal-container').innerHTML = await cartRes.text();

                bindSidebarEvents();
                initApp(); // เริ่มรันระบบสินค้าหลังจากดึงชิ้นส่วนเสร็จแล้ว
            } catch (err) {
                console.error("Error loading components:", err);
            }
        }

        // เริ่มต้นการทำงาน!
        loadComponents();
    </script>
</body>
</html>
