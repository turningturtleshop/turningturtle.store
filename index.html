<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f5f5f5; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-image { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; background: #eaeaea; }
        .price { color: #2ecc71; font-weight: bold; font-size: 1.2em; }
        .btn-cart { background: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        .btn-cart:disabled { background: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>🛒 แคตตาล็อกสินค้า Turning Turtle</h1>
    <div id="loading">กำลังดึงข้อมูลสินค้าจากหลังบ้าน... ⏳</div>
    
    <!-- ตรงนี้คือพื้นที่สำหรับแสดงการ์ดสินค้า -->
    <div class="product-grid" id="product-container"></div>

    <script>
        // เอาลิงก์ Web App ของคุณมาใส่ตรงนี้
        const API_URL = 'https://script.google.com/macros/s/AKfycbxfeR9gyKcrHlP_H7knJi21MUWiY85rceoVjKo7Pti1OJ9rtrZdLn1BVpD9jtYpJsygLA/exec';

        async function loadProducts() {
            try {
                // เติม ?action=getProducts เพื่อสั่งให้ doGet(e) ส่ง JSON สินค้ามาให้
                const response = await fetch(API_URL + '?action=getProducts');
                const result = await response.json();

                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('product-container');

                if (result.status === 'success') {
                    // วนลูปสร้างการ์ดสินค้า
                    result.data.forEach(product => {
                        const isOutOfStock = product.stock <= 0;
                        const stockText = isOutOfStock ? '<span style="color:red">สินค้าหมด</span>' : `เหลือ ${product.stock} ชิ้น`;
                        
                        const card = `
                            <div class="product-card">
                                ${product.image ? `<img src="${product.image}" alt="${product.name}" class="product-image">` : '<div class="product-image" style="display:flex; align-items:center; justify-content:center;">ไม่มีรูป</div>'}
                                <h3>${product.name}</h3>
                                <p style="color:gray; font-size: 0.9em;">สี: ${product.color} | ไซส์: ${product.size}</p>
                                <p class="price">฿${product.price.toLocaleString()}</p>
                                <p><small>${stockText}</small></p>
                                <button class="btn-cart" ${isOutOfStock ? 'disabled' : ''}>
                                    ${isOutOfStock ? 'หมด' : 'เพิ่มลงตะกร้า'}
                                </button>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = `<p style="color:red">Error: ${result.message}</p>`;
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '<p style="color:red">โหลดข้อมูลไม่สำเร็จ รบกวนรีเฟรชใหม่อีกครั้ง</p>';
                console.error(error);
            }
        }

        // เริ่มโหลดสินค้าเมื่อเปิดเว็บ
        loadProducts();
    </script>
</body>
</html>
