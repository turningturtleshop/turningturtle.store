<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle Store - Retro Edition</title>
    <style>
        /* ฟอนต์และพื้นหลังสีคลาสสิกของ Windows 95 */
        body { 
            font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif; 
            padding: 20px; 
            background: #008080; /* สีเขียวอมฟ้าเอกลักษณ์ของยุค 90s */
            color: #000;
        }

        /* หัวเว็บตกแต่งด้วยสีของร้าน 💛❤️💙 */
        h1 {
            color: white;
            text-shadow: 2px 2px 0 #000;
            text-align: center;
            margin-bottom: 30px;
        }
        .header-emoji { letter-spacing: 5px; }

        /* กรอบโหลดข้อมูล */
        #loading {
            background: #c0c0c0;
            padding: 15px;
            border: 2px solid;
            border-color: #fff #000 #000 #fff; /* ขอบนูนแบบ 3D */
            display: inline-block;
            font-weight: bold;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 25px; 
            margin-top: 20px; 
        }

        /* ตัวการ์ดสินค้าทำเป็นหน้าต่าง Window */
        .product-card { 
            background: #c0c0c0; /* สีเทา Windows */
            border: 2px solid;
            border-color: #fff #000 #000 #fff;
            padding: 3px; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        /* แถบหัวหน้าต่าง (Title bar) */
        .window-header {
            background: #000080; /* สีน้ำเงินเข้ม */
            color: white;
            padding: 4px 6px;
            font-weight: bold;
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        /* ปุ่มย่อ/ขยาย/ปิด แบบจำลอง */
        .window-btn-group { display: flex; gap: 3px; }
        .window-btn {
            background: #c0c0c0;
            border: 1px solid;
            border-color: #fff #000 #000 #fff;
            color: black;
            width: 14px; 
            height: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 10px; 
            font-weight: bold;
            cursor: pointer;
        }

        /* รูปภาพยุบเป็นกรอบลึกลงไป */
        .product-image { 
            max-width: 100%; 
            height: 220px; 
            object-fit: cover; 
            border: 2px solid;
            border-color: #808080 #fff #fff #808080; /* ขอบยุบ (Inset) */
            background: #fff;
            margin-bottom: 10px;
        }

        /* เนื้อหาด้านใน */
        .card-content {
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title { margin: 5px 0 10px 0; font-size: 1.1em; }
        .details { font-size: 0.85em; margin: 0; }
        .price { color: #d10000; font-weight: bold; font-size: 1.2em; margin: 10px 0; } /* สีแดงให้เข้ากับไอจี */
        
        /* ปุ่มแบบ Retro */
        .btn-cart { 
            background: #c0c0c0; 
            color: black; 
            font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif;
            font-weight: bold;
            border: 2px solid; 
            border-color: #fff #000 #000 #fff;
            padding: 8px 15px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: auto;
        }
        .btn-cart:active:not(:disabled) {
            border-color: #000 #fff #fff #000; /* กดแล้วปุ่มยุบ */
            padding: 9px 14px 7px 16px; /* ขยับตัวอักษรลงตอนกด */
        }
        .btn-cart:disabled { 
            color: #808080; 
            text-shadow: 1px 1px 0 #fff; /* เอฟเฟกต์ตัวอักษรจมๆ ตอนสินค้าหมด */
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

    <h1><span class="header-emoji">💛❤️💙</span><br>Turning Turtle Store</h1>
    
    <div style="text-align: center;">
        <div id="loading">⌛ Downloading products... please wait.</div>
    </div>
    
    <!-- ตรงนี้คือพื้นที่สำหรับแสดงการ์ดสินค้า -->
    <div class="product-grid" id="product-container"></div>

    <script>
        // ลิงก์ Web App API ของคุณ
        const API_URL = 'https://script.google.com/macros/s/AKfycbzOJsYhEszCZkh5QXxNqegGS_daCmBThK1hU2b-vF_NAI1f_Mg1A3O4BYyfRaThjezfbw/exec';

        async function loadProducts() {
            try {
                const response = await fetch(API_URL + '?action=getProducts');
                const result = await response.json();

                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('product-container');

                if (result.status === 'success') {
                    // วนลูปสร้างหน้าต่าง Window ของแต่ละสินค้า
                    result.data.forEach(product => {
                        const isOutOfStock = product.stock <= 0;
                        const stockText = isOutOfStock ? '<span style="color:#d10000; font-weight:bold;">SOLD OUT</span>' : `In Stock: ${product.stock}`;
                        
                        const card = `
                            <div class="product-card">
                                <!-- Title Bar แบบวินเทจ -->
                                <div class="window-header">
                                    <span>${product.name.replace(/\s+/g, '')}.exe</span>
                                    <div class="window-btn-group">
                                        <div class="window-btn">_</div>
                                        <div class="window-btn">□</div>
                                        <div class="window-btn">X</div>
                                    </div>
                                </div>

                                <!-- เนื้อหาสินค้า -->
                                <div class="card-content">
                                    ${product.image ? `<img src="${product.image}" alt="${product.name}" class="product-image">` : '<div class="product-image" style="display:flex; align-items:center; justify-content:center; color:#808080;">NO IMAGE</div>'}
                                    <h3 class="product-title">${product.name}</h3>
                                    <p class="details">Color: ${product.color} | Size: ${product.size}</p>
                                    <p class="price">฿${product.price.toLocaleString()}</p>
                                    <p style="margin-bottom: 15px;"><small>${stockText}</small></p>
                                    
                                    <!-- ปุ่มเพิ่มลงตะกร้า -->
                                    <button class="btn-cart" ${isOutOfStock ? 'disabled' : ''}>
                                        ${isOutOfStock ? 'OUT OF STOCK' : 'OK'}
                                    </button>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = `<div id="loading" style="color:#d10000;">Error: ${result.message}</div>`;
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '<span style="color:#d10000;">System Error. Please refresh.</span>';
                console.error(error);
            }
        }

        // เริ่มโหลดสินค้าเมื่อเปิดเว็บ
        loadProducts();
    </script>
</body>
</html>
