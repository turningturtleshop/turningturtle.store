<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle</title>
    <!-- โหลด Tailwind CSS เพื่อความสวยงามและรวดเร็ว -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- แถบเมนูนำทาง (ตรึงไว้ด้านบน) -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
        
        <!-- ซ้าย: ปุ่มขีดสามขีด + ชื่อแบรนด์ + เต่า -->
        <div class="flex items-center space-x-3">
            <button id="menu-btn" class="focus:outline-none hover:bg-gray-100 p-1 rounded">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <a href="index.html" class="font-bold tracking-wider text-lg flex items-center space-x-2">
                <span>Turning turtle</span>
                <span class="text-sm">🐢🐢🐢</span>
            </a>
        </div>

        <!-- ขวา: ค้นหา + ตะกร้า + เปลี่ยนภาษา -->
        <div class="flex items-center space-x-4">
            <button class="hover:text-gray-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
            <button class="hover:text-gray-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg></button>
            <span class="text-sm font-medium cursor-pointer hover:text-gray-600">EN / TH</span>
        </div>
    </header>

    <!-- เมนู Pop-up ด้านซ้าย (Sidebar) -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 p-6">
        <button id="close-btn" class="absolute top-4 right-4 text-gray-400 hover:text-black">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        
        <nav class="mt-8 space-y-6">
            <a href="index.html" class="block text-lg font-medium hover:text-gray-600">Home</a>
            <a href="new-in.html" class="block text-lg font-medium hover:text-gray-600">New in</a>
            
            <!-- เมนูย่อย Shop all -->
            <div>
                <button id="shop-dropdown-btn" class="w-full flex justify-between items-center text-lg font-medium hover:text-gray-600">
                    <span>Shop all</span>
                    <svg id="dropdown-icon" class="w-4 h-4 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="shop-submenu" class="pl-4 mt-3 space-y-3 hidden">
                    <a href="shop.html?type=Tops" class="block text-gray-600 hover:text-black">Tops</a>
                    <a href="shop.html?type=Bottoms" class="block text-gray-600 hover:text-black">Bottoms</a>
                    <a href="shop.html?type=Underwears" class="block text-gray-600 hover:text-black">Underwears</a>
                </div>
            </div>

            <a href="contact.html" class="block text-lg font-medium hover:text-gray-600">Contact</a>
        </nav>
    </div>

    <!-- ฉากหลังสีดำตอนเปิดเมนู (Overlay) -->
    <div id="overlay" class="fixed inset-0 bg-black opacity-50 hidden z-40"></div>

    <!-- พื้นที่แสดงเนื้อหาหน้า Home (เดี๋ยวเรามาเติมสินค้าแนะนำกันทีหลัง) -->
    <main class="p-8 text-center mt-10">
        <h1 class="text-3xl font-bold mb-4">Welcome to Turning Turtle</h1>
        <p class="text-gray-600">เนื้อหาสินค้าแนะนำ 3 ชิ้น จะถูกนำมาใส่ตรงนี้ครับ</p>
    </main>

    <!-- Script ควบคุมการเปิด/ปิดเมนู -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const shopDropdownBtn = document.getElementById('shop-dropdown-btn');
        const shopSubmenu = document.getElementById('shop-submenu');
        const dropdownIcon = document.getElementById('dropdown-icon');

        // เปิดเมนู
        menuBtn.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        });

        // ปิดเมนู
        const closeMenu = () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        };
        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        // เปิด/ปิด Dropdown เมนู Shop all
        shopDropdownBtn.addEventListener('click', () => {
            shopSubmenu.classList.toggle('hidden');
            dropdownIcon.classList.toggle('rotate-180');
        });
    </script>
</body>
</html>
