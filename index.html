<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle Store - Retro Edition</title>
    <style>
        body { font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif; padding: 20px; background: #008080; color: #000; padding-bottom: 90px; }
        h1 { color: white; text-shadow: 2px 2px 0 #000; text-align: center; margin-bottom: 30px; }
        .header-emoji { letter-spacing: 5px; }

        .retro-box { background: #c0c0c0; padding: 15px; border: 2px solid; border-color: #fff #000 #000 #fff; box-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        #loading { display: inline-block; font-weight: bold; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; margin-top: 20px; }

        .product-card { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 3px; display: flex; flex-direction: column; }
        .window-header { background: #000080; color: white; padding: 4px 6px; font-weight: bold; font-size: 0.85em; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .window-btn-group { display: flex; gap: 3px; }
        .window-btn { background: #c0c0c0; border: 1px solid; border-color: #fff #000 #000 #fff; color: black; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        
        .product-image { max-width: 100%; height: 220px; object-fit: cover; border: 2px solid; border-color: #808080 #fff #fff #808080; background: #fff; margin-bottom: 10px; }
        .card-content { padding: 10px; text-align: center; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { margin: 5px 0 10px 0; font-size: 1.1em; }
        
        .options-group { margin: 10px 0; text-align: left; font-size: 0.9em; }
        .options-group label { display: block; font-weight: bold; margin-bottom: 2px; }
        .options-group select { width: 100%; padding: 4px; border: 2px solid; border-color: #808080 #fff #fff #808080; font-family: 'MS Sans Serif', sans-serif; }

        .price { color: #d10000; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
        
        .btn-retro { background: #c0c0c0; color: black; font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif; font-weight: bold; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 8px 15px; cursor: pointer; }
        .btn-retro:active:not(:disabled) { border-color: #000 #fff #fff #000; padding: 9px 14px 7px 16px; }
        .btn-retro:disabled { color: #808080; text-shadow: 1px 1px 0 #fff; cursor: not-allowed; }
        .btn-cart { width: 100%; margin-top: auto; }

        .floating-cart { position: fixed; bottom: 0; left: 0; width: 100%; background: #c0c0c0; border-top: 2px solid #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; box-shadow: 0 -2px 5px rgba(0,0,0,0.2); }
        
        #cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,128,128,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 3px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-body { padding: 15px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #808080; padding: 10px 0; }
        .cart-item-details { flex-grow: 1; text-align: left; margin-right: 10px;}
        .cart-item-title { font-weight: bold; margin: 0; }
        .cart-item-qty { display: flex; align-items: center; gap: 5px; }
        .qty-btn { width: 25px; height: 25px; font-weight: bold; cursor: pointer; }

        .form-group { margin-top: 12px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 3px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 5px; border: 2px solid; border-color: #808080 #fff #fff #808080; font-family: 'MS Sans Serif', sans-serif; box-sizing: border-box; }
        
        .totals { margin-top: 15px; padding-top: 10px; border-top: 2px solid #808080; text-align: right; font-weight: bold; font-size: 1.1em;}
        .qr-section { text-align: center; background: #fff; padding: 10px; border: 2px inset #808080; margin-top: 10px; }
    </style>
</head>
<body>

    <h1><span class="header-emoji">💛❤️💙</span><br>Turning Turtle Store</h1>
    
    <div style="text-align: center;">
        <div id="loading" class="retro-box">⌛ Downloading products... please wait.</div>
    </div>
    
    <div class="product-grid" id="product-container"></div>

    <div class="floating-cart">
        <div style="font-weight: bold; font-size: 1.2em;">
            🛍️ Cart: <span id="cart-count">0</span> items (<span style="color:#d10000">฿<span id="cart-total">0</span></span>)
        </div>
        <button class="btn-retro" onclick="openCart()">View Cart</button>
    </div>

    <div id="cart-modal">
        <div class="modal-content">
            <div class="window-header">
                <span>Checkout.exe</span>
                <div class="window-btn-group">
                    <div class="window-btn" onclick="closeCart()">X</div>
                </div>
            </div>
            <div class="modal-body">
                <h3 style="margin-top: 0;">🛒 Your Order</h3>
                <div id="cart-items-container"></div>
                
                <div class="totals" id="summary-section">
                    Subtotal: ฿<span id="sub-total">0</span><br>
                    Shipping: ฿<span id="shipping-fee">50</span><br>
                    <span style="color: #d10000;">Total: ฿<span id="checkout-total">0</span></span>
                </div>

                <hr style="border: 1px solid #808080; margin: 15px 0;">
                
                <h3>📝 Shipping & Payment Details</h3>
                <form id="checkout-form" onsubmit="submitOrder(event)">
                    <div class="form-group">
                        <label>Name (ชื่อ-นามสกุล)*</label>
                        <input type="text" id="custName" required>
                    </div>
                    <div class="form-group">
                        <label>Phone (เบอร์โทร)*</label>
                        <input type="tel" id="custPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Email (อีเมลสำหรับรับการแจ้งเตือน)*</label>
                        <input type="email" id="custEmail" required placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label>Address (ที่อยู่จัดส่ง)*</label>
                        <textarea id="custAddress" rows="2" required></textarea>
                    </div>
                    
                    <div class="qr-section">
                        <p style="margin: 0 0 5px 0; font-weight: bold; font-size: 0.9em;">💳 Scan QR Code to Pay (โอนชำระเงิน)</p>
                        <!-- เปลี่ยนลิงก์ภาพ QR Code พร้อมเพย์ของคุณตรงนี้ -->
                        <img src="https://promptpay.io/0812345678/0.png" alt="QR Code" style="width: 130px; height: 130px;">
                        <p style="margin: 5px 0 0 0; font-size: 0.8em; color: #555;">PromptPay: Turning Turtle</p>
                    </div>

                    <div class="form-group">
                        <label>Upload Slip (แนบสลิปโอนเงิน)*</label>
                        <input type="file" id="slipFile" accept="image/*" required style="background: #fff;">
                    </div>

                    <button type="submit" id="btn-submit" class="btn-retro" style="width: 100%; margin-top: 15px; font-size: 1.1em; color: #d10000;">
                        Submit Order (ยืนยันคำสั่งซื้อ)
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyxyOC4ufNZlmD19KJV_RGj3CwO6j5w5ifdyfKl-4JJv1FdCmoWcVuhFQF1dm9UngW-/exec'; // ลิงก์เวอร์ชัน 27 ล่าสุด
        
        let groupedProducts = {}; 
        let cart = []; 

        async function loadProducts() {
            try {
                const response = await fetch(API_URL + '?action=getProducts');
                const result = await response.json();

                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('product-container');

                if (result.status === 'success') {
                    groupedProducts = {};
                    result.data.forEach(p => {
                        if (!groupedProducts[p.name]) {
                            groupedProducts[p.name] = {
                                name: p.name,
                                basePrice: p.price,
                                colors: [...new Set(result.data.filter(item => item.name === p.name).map(item => item.color))],
                                sizes: [...new Set(result.data.filter(item => item.name === p.name).map(item => item.size))],
                                items: result.data.filter(item => item.name === p.name)
                            };
                        }
                    });
                    renderProducts();
                } else {
                    container.innerHTML = `<div class="retro-box" style="color:#d10000;">Error: ${result.message}</div>`;
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '<span style="color:#d10000;">System Error. Please refresh.</span>';
            }
        }

        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            
            Object.keys(groupedProducts).forEach(name => {
                const prodGroup = groupedProducts[name];
                const firstItem = prodGroup.items[0];

                const colorOptions = prodGroup.colors.map(c => `<option value="${c}">${c}</option>`).join('');
                const sizeOptions = prodGroup.sizes.map(s => `<option value="${s}">${s}</option>`).join('');

                const card = `
                    <div class="product-card" id="card-${name.replace(/\s+/g, '')}">
                        <div class="window-header">
                            <span>${name.replace(/\s+/g, '')}.exe</span>
                            <div class="window-btn-group"><div class="window-btn">_</div><div class="window-btn">□</div><div class="window-btn">X</div></div>
                        </div>
                        <div class="card-content">
                            <img src="${firstItem.image}" alt="${name}" class="product-image" id="img-${name.replace(/\s+/g, '')}">
                            <h3 class="product-title">${name}</h3>
                            <p class="price" id="price-${name.replace(/\s+/g, '')}">฿${firstItem.price.toLocaleString()}</p>
                            
                            <div class="options-group">
                                <label>Color:</label>
                                <select id="color-${name.replace(/\s+/g, '')}" onchange="updateProductVariant('${name}')">${colorOptions}</select>
                            </div>
                            <div class="options-group">
                                <label>Size:</label>
                                <select id="size-${name.replace(/\s+/g, '')}" onchange="updateProductVariant('${name}')">${sizeOptions}</select>
                            </div>

                            <p style="margin: 10px 0;"><small id="stock-${name.replace(/\s+/g, '')}">In Stock: ${firstItem.stock}</small></p>
                            
                            <button class="btn-retro btn-cart" id="btn-${name.replace(/\s+/g, '')}" onclick="addVaultToCart('${name}')">
                                ADD TO CART
                            </button>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function findVariant(name) {
            const safeName = name.replace(/\s+/g, '');
            const selectedColor = document.getElementById('color-' + safeName).value;
            const selectedSize = document.getElementById('size-' + safeName).value;
            const prodGroup = groupedProducts[name];
            return prodGroup.items.find(i => i.color === selectedColor && i.size === selectedSize);
        }

        function updateProductVariant(name) {
            const variant = findVariant(name);
            const safeName = name.replace(/\s+/g, '');
            
            if (variant) {
                if(variant.image) document.getElementById('img-' + safeName).src = variant.image;
                document.getElementById('price-' + safeName).innerText = '฿' + variant.price.toLocaleString();
                
                const stockEl = document.getElementById('stock-' + safeName);
                const btnEl = document.getElementById('btn-' + safeName);
                
                if (variant.stock <= 0) {
                    stockEl.innerHTML = '<span style="color:#d10000; font-weight:bold;">SOLD OUT</span>';
                    btnEl.disabled = true;
                    btnEl.innerText = 'OUT OF STOCK';
                } else {
                    stockEl.innerText = 'In Stock: ' + variant.stock;
                    btnEl.disabled = false;
                    btnEl.innerText = 'ADD TO CART';
                }
            }
        }

        function addVaultToCart(name) {
            const variant = findVariant(name);
            if (!variant || variant.stock <= 0) return;

            const existingItem = cart.find(item => item.sku === variant.sku);
            if (existingItem) {
                if (existingItem.qty < variant.stock) existingItem.qty += 1;
                else alert('สินค้าในสต๊อกหมดแล้วครับ');
            } else {
                cart.push({ ...variant, qty: 1 });
            }
            updateCartUI();
        }

        function changeQty(sku, delta) {
            const item = cart.find(i => i.sku === sku);
            if (!item) return;

            const group = Object.values(groupedProducts).find(g => g.items.some(i => i.sku === sku));
            const variant = group.items.find(i => i.sku === sku);

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.sku !== sku);
            } else if (item.qty > variant.stock) {
                item.qty = variant.stock;
                alert('เกินจำนวนสต๊อกที่มี');
            }
            updateCartUI();
        }

        function updateCartUI() {
            let count = 0;
            let subtotal = 0;
            
            const cartContainer = document.getElementById('cart-items-container');
            cartContainer.innerHTML = '';

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p>ตะกร้าว่างเปล่า</p>';
            } else {
                cart.forEach(item => {
                    count += item.qty;
                    subtotal += (item.price * item.qty);
                    
                    cartContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-details">
                                <p class="cart-item-title">${item.name}</p>
                                <small>${item.color} / ${item.size} (฿${item.price})</small>
                            </div>
                            <div class="cart-item-qty">
                                <button class="btn-retro qty-btn" onclick="changeQty('${item.sku}', -1)">-</button>
                                <span style="display:inline-block; width: 20px; text-align:center;">${item.qty}</span>
                                <button class="btn-retro qty-btn" onclick="changeQty('${item.sku}', 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            // เงื่อนไขค่าส่ง Flash: >3000 ส่งฟรี ไม่งั้น 50 บาท
            const shippingFee = (subtotal > 3000 || subtotal === 0) ? 0 : 50;
            const netTotal = subtotal + shippingFee;

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = subtotal.toLocaleString();
            document.getElementById('sub-total').innerText = subtotal.toLocaleString();
            document.getElementById('shipping-fee').innerText = shippingFee.toLocaleString() + (shippingFee === 0 && subtotal > 3000 ? ' (ส่งฟรี 🎉)' : '');
            document.getElementById('checkout-total').innerText = netTotal.toLocaleString();
        }

        function openCart() { document.getElementById('cart-modal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        // แปลงไฟล์รูปสลิปเป็น Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function submitOrder(event) {
            event.preventDefault();
            if (cart.length === 0) { alert('ตะกร้าว่างเปล่าครับ'); return; }

            const fileInput = document.getElementById('slipFile');
            if (fileInput.files.length === 0) { alert('กรุณาแนบสลิปโอนเงินก่อนยืนยันคำสั่งซื้อ'); return; }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = '⏳ กำลังอัปโหลดสลิปและส่งออเดอร์...';
            btnSubmit.disabled = true;

            try {
                const base64Slip = await getBase64(fileInput.files[0]);

                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                const shippingFee = subtotal > 3000 ? 0 : 50;
                const netTotal = subtotal + shippingFee;

                const orderData = {
                    orderDate: new Date().toISOString(),
                    customer: document.getElementById('custName').value,
                    phone: document.getElementById('custPhone').value,
                    email: document.getElementById('custEmail').value,
                    address: document.getElementById('custAddress').value,
                    method: "Online",
                    shippingMethod: shippingFee === 0 ? "Flash (Free)" : "Flash Express",
                    shippingFee: shippingFee,
                    total: subtotal,
                    discount: 0,
                    netTotal: netTotal,
                    remark: "สั่งจากหน้าเว็บ GitHub + แนบสลิป",
                    slipBase64: base64Slip,
                    items: cart.map(item => ({
                        sku: item.sku,
                        name: item.name,
                        color: item.color,
                        size: item.size,
                        qty: item.qty,
                        price: item.price
                    }))
                };

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(orderData)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    alert('🎉 ขอบคุณครับ! ' + result.message);
                    cart = [];
                    updateCartUI();
                    closeCart();
                    loadProducts();
                } else {
                    alert('❌ เกิดข้อผิดพลาด: ' + result.message);
                }
            } catch (error) {
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง');
                console.error(error);
            } finally {
                btnSubmit.innerText = 'Submit Order (ยืนยันคำสั่งซื้อ)';
                btnSubmit.disabled = false;
                document.getElementById('checkout-form').reset();
            }
        }

        loadProducts();
    </script>
</body>
</html>
