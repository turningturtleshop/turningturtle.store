<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #008080; font-family: 'Chakra Petch', sans-serif; }
        .font-pixel { font-family: 'VT323', monospace; }
        .retro-window { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080; }
        .retro-btn { background-color: #c0c0c0; border-top: 2px solid #ffffff; border-left: 2px solid #ffffff; border-right: 2px solid #000000; border-bottom: 2px solid #000000; cursor: pointer; }
        .retro-btn:active { border-top: 2px solid #000000; border-left: 2px solid #000000; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; padding-top: 2px; padding-left: 2px; }
        .retro-titlebar { background-color: #0000aa; color: white; padding: 4px 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .retro-content { background-color: white; border-top: 2px solid #808080; border-left: 2px solid #808080; border-right: 2px solid #ffffff; border-bottom: 2px solid #ffffff; }
        @keyframes roll { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
        .turtle-roll { display: inline-block; transition: all 0.3s; }
        .turtle-roll:hover { animation: roll 1s linear infinite; cursor: pointer; }
    </style>
</head>
<body class="text-gray-900 overflow-x-hidden relative">

    <!-- 1. แถบเมนูนำทาง -->
    <header class="sticky top-0 z-40 retro-window px-2 py-2 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <button id="menu-btn" class="retro-btn px-2 py-1 flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <a href="index.html" class="font-bold tracking-wider text-xl flex items-center space-x-2 font-pixel text-blue-800 ml-2">
                <span>Turning turtle</span>
                <span class="text-3xl turtle-roll">🐢</span>
            </a>
        </div>
        
        <div class="flex items-center space-x-3">
            <button class="retro-btn p-1 bg-yellow-400 hover:bg-yellow-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
            <!-- ตะกร้าสินค้า -->
            <button onclick="openCart()" class="retro-btn p-1 bg-red-500 text-white hover:bg-red-400 relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs font-bold px-1 border border-black rounded-full">0</span>
            </button>
            <!-- ปุ่มเปลี่ยนภาษา -->
            <button id="lang-btn" onclick="toggleLanguage()" class="retro-btn px-2 py-1 text-xs font-bold bg-white">EN / $</button>
        </div>
    </header>

    <!-- Sidebar Menu (ย่อไว้) -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 transform -translate-x-full transition-transform duration-300 z-50 flex flex-col p-2">
        <div class="retro-window flex-1 flex flex-col shadow-2xl">
            <div class="retro-titlebar"><span class="font-pixel text-xl tracking-widest">Menu.exe</span><button id="close-btn" class="retro-btn bg-gray-200 text-black px-2 py-0 hover:bg-red-500 hover:text-white font-bold">X</button></div>
            <nav class="p-3 space-y-3 retro-content m-2 flex-1">
                <a href="index.html" class="block text-lg font-bold hover:bg-blue-600 hover:text-white p-1 lang-home">Home</a>
                <a href="new-in.html" class="block text-lg font-bold hover:bg-blue-600 hover:text-white p-1 lang-new">New in</a>
                <div><button id="shop-dropdown-btn" class="w-full text-left text-lg font-bold hover:bg-blue-600 hover:text-white p-1 flex justify-between items-center"><span class="lang-shop">Shop all</span><span class="text-xs">▼</span></button>
                    <div id="shop-submenu" class="pl-4 mt-1 space-y-1 hidden bg-yellow-100 border-2 border-black p-2">
                        <a href="shop.html?type=Tops" class="block font-bold hover:bg-red-500 hover:text-white p-1 text-sm">► Tops</a>
                        <a href="shop.html?type=Bottoms" class="block font-bold hover:bg-red-500 hover:text-white p-1 text-sm">► Bottoms</a>
                        <a href="shop.html?type=Underwears" class="block font-bold hover:bg-red-500 hover:text-white p-1 text-sm">► Underwears</a>
                    </div>
                </div>
                <a href="contact.html" class="block text-lg font-bold hover:bg-blue-600 hover:text-white p-1 lang-contact">Contact</a>
            </nav>
        </div>
    </div>
    <div id="overlay" class="fixed inset-0 bg-black opacity-40 hidden z-40"></div>

    <!-- พื้นที่แสดงสินค้าแนะนำ -->
    <main class="p-4 mt-4 max-w-5xl mx-auto">
        <div class="retro-window">
            <div class="retro-titlebar"><span class="font-pixel text-xl tracking-widest">Hot_Items.exe</span></div>
            <div class="retro-content p-6 m-2 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                <div class="text-center mb-6">
                    <h1 class="text-4xl font-bold font-pixel text-blue-800 drop-shadow-md"><span class="text-red-500">TURNING</span> <span class="text-yellow-500">TURTLE</span></h1>
                    <p class="font-bold text-gray-700 mt-2">> New Arrivals_</p>
                </div>
                <div id="product-container" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="col-span-1 md:col-span-4 text-center py-10 bg-white border-2 border-dashed border-gray-400">
                        <p class="text-lg font-bold text-gray-700 animate-pulse">Loading data...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal เลือกสินค้า -->
    <div id="product-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black opacity-60" onclick="closeModal('product-modal')"></div>
        <div class="retro-window w-11/12 md:w-3/4 lg:w-1/2 max-h-[90vh] overflow-y-auto relative z-10 flex flex-col">
            <div class="retro-titlebar"><span id="modal-title" class="font-pixel text-xl tracking-widest">Product.exe</span><button onclick="closeModal('product-modal')" class="retro-btn bg-red-500 text-white px-2 py-0 font-bold hover:bg-red-400">X</button></div>
            <div class="retro-content p-4 m-2 flex-1 bg-white">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <div class="bg-gray-100 border-2 border-gray-300 h-64 flex justify-center overflow-hidden"><img id="modal-img" src="" class="object-cover h-full"></div>
                        <div id="modal-desc-box" class="bg-gray-100 border-2 border-dashed border-gray-300 p-1 hidden">
                            <p class="text-xs font-bold text-center bg-yellow-200 mb-1">Details</p>
                            <img id="modal-desc-img" src="" class="w-full object-contain">
                        </div>
                    </div>
                    <div class="flex flex-col space-y-4">
                        <h2 id="modal-name" class="text-3xl font-pixel font-bold text-blue-800 uppercase"></h2>
                        <p id="modal-price" class="text-2xl font-pixel text-red-600 font-bold" data-thb="0"></p>
                        <div class="h-px w-full bg-black"></div>
                        <div><label class="font-bold text-sm block mb-1">SELECT COLOR:</label><select id="modal-color" class="retro-content w-full p-2 font-bold cursor-pointer"></select></div>
                        <div><label class="font-bold text-sm block mb-1">SELECT SIZE:</label><select id="modal-size" class="retro-content w-full p-2 font-bold cursor-pointer"></select></div>
                        <div class="mt-auto pt-4">
                            <button onclick="addToCart()" class="retro-btn w-full bg-yellow-400 hover:bg-yellow-300 font-bold text-lg py-3 flex justify-center items-center space-x-2">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                <span>ADD TO CART</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal ตะกร้าสินค้าและ Checkout -->
    <div id="cart-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black opacity-60" onclick="closeModal('cart-modal')"></div>
        <div class="retro-window w-11/12 md:w-3/4 max-h-[90vh] overflow-y-auto relative z-10 flex flex-col">
            <div class="retro-titlebar"><span class="font-pixel text-xl tracking-widest">Cart_Checkout.exe</span><button onclick="closeModal('cart-modal')" class="retro-btn bg-red-500 text-white px-2 py-0 font-bold hover:bg-red-400">X</button></div>
            <div class="retro-content p-4 m-2 bg-white flex flex-col md:flex-row gap-6">
                <!-- รายการในตะกร้า -->
                <div class="flex-1 border-2 border-gray-300 p-2">
                    <h3 class="font-bold bg-blue-800 text-white p-1 mb-2">Shopping Cart</h3>
                    <div id="cart-items" class="space-y-2 max-h-60 overflow-y-auto"></div>
                    <div class="mt-4 border-t-2 border-black pt-2 font-bold flex justify-between">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal" class="text-red-600">฿0</span>
                    </div>
                </div>
                <!-- ฟอร์ม Checkout -->
                <div class="flex-1 border-2 border-gray-300 p-2 bg-gray-50">
                    <h3 class="font-bold bg-yellow-400 border-b-2 border-black p-1 mb-2">Checkout Info</h3>
                    <div class="space-y-2 text-sm font-bold">
                        <input type="text" id="cust-name" placeholder="Name" class="retro-content w-full p-1">
                        <textarea id="cust-addr" placeholder="Address" class="retro-content w-full p-1 h-16"></textarea>
                        
                        <label>Country:</label>
                        <select id="cust-country" class="retro-content w-full p-1 cursor-pointer" onchange="calculateShipping()"></select>
                        
                        <div class="bg-white border border-gray-300 p-2 mt-2">
                            <div class="flex justify-between text-xs text-gray-500"><span id="ship-platform">Shipping</span><span id="ship-cond"></span></div>
                            <div class="flex justify-between mt-1"><span>Shipping Fee:</span><span id="ship-fee" class="text-red-600">฿0</span></div>
                            <div class="flex justify-between mt-2 text-lg"><span>TOTAL:</span><span id="grand-total" class="text-blue-800">฿0</span></div>
                        </div>
                        
                        <button onclick="alert('ระบบบันทึกออเดอร์ลงชีตกำลังจะมาในเฟส 3!')" class="retro-btn w-full bg-red-500 text-white hover:bg-red-400 font-bold py-2 mt-4">
                            PLACE ORDER_
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. การตั้งค่าภาษาและสกุลเงิน ---
        let currentLang = 'EN';
        const exchangeRate = 35; // 1 USD = 35 THB

        function toggleLanguage() {
            currentLang = currentLang === 'EN' ? 'TH' : 'EN';
            document.getElementById('lang-btn').innerText = currentLang === 'EN' ? 'EN / $' : 'TH / ฿';
            
            // แปลภาษาเมนู
            document.querySelector('.lang-home').innerText = currentLang === 'EN' ? 'Home' : 'หน้าแรก';
            document.querySelector('.lang-new').innerText = currentLang === 'EN' ? 'New in' : 'สินค้าใหม่';
            document.querySelector('.lang-shop').innerText = currentLang === 'EN' ? 'Shop all' : 'สินค้าทั้งหมด';
            document.querySelector('.lang-contact').innerText = currentLang === 'EN' ? 'Contact' : 'ติดต่อเรา';
            
            // อัปเดตราคาใหม่ทั้งหน้า
            renderHomeProducts();
            updateCartCount();
            if(!document.getElementById('cart-modal').classList.contains('hidden')) renderCart();
        }

        // แปลงราคาตามสกุลเงินที่เลือก
        function formatPrice(thbPrice) {
            if (currentLang === 'EN') return '$' + (thbPrice / exchangeRate).toFixed(2);
            return '฿' + thbPrice;
        }

        // --- 2. การควบคุมระบบตะกร้า (Cart) ผ่าน LocalStorage ---
        let cart = JSON.parse(localStorage.getItem('turtle_cart')) || [];
        
        function updateCartCount() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = totalQty;
            localStorage.setItem('turtle_cart', JSON.stringify(cart));
        }

        function addToCart() {
            const name = document.getElementById('modal-name').innerText;
            const price = parseInt(document.getElementById('modal-price').getAttribute('data-thb'));
            const color = document.getElementById('modal-color').value;
            const size = document.getElementById('modal-size').value;
            const image = document.getElementById('modal-img').src;

            // เช็คว่ามีสินค้านี้ในตะกร้าหรือยัง
            const existing = cart.find(i => i.name === name && i.color === color && i.size === size);
            if (existing) existing.qty += 1;
            else cart.push({ name, price, color, size, image, qty: 1 });

            updateCartCount();
            closeModal('product-modal');
            
            // แจ้งเตือนสไตล์ 90s
            alert(`Added ${name} (${color}, ${size}) to Cart!`);
        }

        function openCart() {
            renderCart();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        // --- 3. ดึงข้อมูลสินค้าและค่าจัดส่ง (API) ---
        // 🚨 เอา URL ใหม่ของคุณมาใส่ตรงบรรทัดนี้แทนที่อันเดิมนะครับ (ระวังอย่าลบ ?action=...) 
        const API_URL_BASE = 'https://script.google.com/macros/s/AKfycbzKlfhEfV6MK6apxmyZY-ALMP6uWT9J4NKYgUixMBSHHTraH-YQ9AAT7qG5tbOs1SqE2g/exec';
        
        let globalGroupedProducts = {}; 
        let shipmentRates = [];

        async function initApp() {
            try {
                // โหลดข้อมูลสินค้า
                const resProd = await fetch(API_URL_BASE + '?action=getProducts');
                const jsonProd = await resProd.json();
                
                // โหลดข้อมูลค่าส่ง
                const resShip = await fetch(API_URL_BASE + '?action=getShipment');
                const jsonShip = await resShip.json();
                shipmentRates = jsonShip.data || [];
                
                // ใส่ตัวเลือกประเทศใน Checkout
                const countrySelect = document.getElementById('cust-country');
                shipmentRates.forEach(rate => {
                    countrySelect.innerHTML += `<option value="${rate.countryEN}">${rate.countryEN} / ${rate.countryTH}</option>`;
                });

                if (jsonProd.status === 'success') {
                    const groups = {};
                    jsonProd.data.forEach(p => {
                        let nameKey = p.name.trim().toUpperCase();
                        if(nameKey === 'WOOL - EYES') nameKey = 'WOOL-EYES';
                        if(!groups[nameKey]) {
                            groups[nameKey] = {
                                name: p.name, image: p.image, hoverImage: (p.images && p.images[1]) ? p.images[1] : p.image,
                                descImage: (p.images && p.images[2]) ? p.images[2] : '', price: p.price,
                                colors: new Set(), sizes: new Set()
                            };
                        }
                        groups[nameKey].colors.add(p.color);
                        groups[nameKey].sizes.add(p.size);
                    });
                    globalGroupedProducts = groups;
                    renderHomeProducts();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('product-container').innerHTML = `<p class="text-red-600 font-bold p-10">Connection Error</p>`;
            }
            updateCartCount();
        }

        // แสดงสินค้า 4 ตัวหลักหน้า Home
        function renderHomeProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; 
            const targetNames = ['ZORA', 'WOOL-EYES', 'GEORGE', 'LAMBS'];
            const productsToShow = targetNames.map(n => globalGroupedProducts[n]).filter(Boolean);

            productsToShow.forEach(group => {
                const priceStr = formatPrice(group.price);
                container.innerHTML += `
                    <div onclick="openProductModal('${group.name.trim().toUpperCase()}')" class="retro-window p-2 bg-white flex flex-col items-center hover:scale-105 transition-transform cursor-pointer">
                        <div class="retro-content w-full p-1 mb-2 bg-gray-100 flex justify-center h-48 overflow-hidden">
                            <img src="${group.image}" onmouseover="this.src='${group.hoverImage}'" onmouseout="this.src='${group.image}'" class="object-cover h-full transition-opacity duration-300">
                        </div>
                        <h3 class="font-bold text-xl text-blue-800 font-pixel tracking-wide text-center uppercase">${group.name}</h3>
                        <div class="w-full bg-black h-px my-2"></div>
                        <p class="font-pixel text-xl text-red-600 font-bold mb-2">${priceStr}</p>
                        <button class="retro-btn bg-yellow-400 font-bold px-2 py-1 w-full text-sm">VIEW</button>
                    </div>
                `;
            });
        }

        // --- 4. ระบบคำนวณเงินใน Checkout ---
        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            let subtotalTHB = 0;

            if(cart.length === 0) {
                cartItemsDiv.innerHTML = '<p class="text-gray-500 text-sm">Cart is empty.</p>';
            } else {
                cart.forEach((item, index) => {
                    subtotalTHB += (item.price * item.qty);
                    cartItemsDiv.innerHTML += `
                        <div class="flex items-center space-x-2 text-xs border-b border-gray-300 pb-1">
                            <img src="${item.image}" class="w-10 h-10 object-cover border border-black">
                            <div class="flex-1">
                                <p class="font-bold">${item.name} <span class="text-red-500 cursor-pointer text-xs" onclick="removeItem(${index})">[x]</span></p>
                                <p class="text-gray-600">${item.color} | ${item.size} x${item.qty}</p>
                            </div>
                            <div class="font-bold">${formatPrice(item.price * item.qty)}</div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('cart-subtotal').innerText = formatPrice(subtotalTHB);
            document.getElementById('cart-subtotal').setAttribute('data-thb', subtotalTHB);
            calculateShipping();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartCount();
            renderCart();
        }

        // 🚀 ระบบคำนวณค่าส่งอัจฉริยะ ดึงจากคอลัมน์ F!
        function calculateShipping() {
            const selectedCountry = document.getElementById('cust-country').value;
            const subtotalTHB = parseInt(document.getElementById('cart-subtotal').getAttribute('data-thb')) || 0;
            
            const rateInfo = shipmentRates.find(r => r.countryEN === selectedCountry);
            let finalFeeTHB = 0;

            if (rateInfo) {
                finalFeeTHB = rateInfo.fee; // เริ่มด้วยค่าส่งพื้นฐาน (จากคอลัมน์ D)
                document.getElementById('ship-platform').innerText = rateInfo.platform;
                document.getElementById('ship-cond').innerText = `(${rateInfo.condition})`;
                
                // ใช้ Regex ดึงตัวเลขยอดสั่งซื้อขั้นต่ำจากข้อความคอลัมน์ F 
                // (เช่น "Minimum order 5000 THB" ดึงได้ 5000 / ">2000" ดึงได้ 2000)
                const numberMatch = rateInfo.condition.match(/\d+/); 
                if (numberMatch) {
                    const conditionAmount = parseInt(numberMatch[0]);
                    
                    // ถ้าเงื่อนไขมีคำว่า '<' (เช่น <2000 แปลว่ายอดน้อยกว่าถึงจะเสียค่าส่ง)
                    if (rateInfo.condition.includes('<')) {
                        if (subtotalTHB >= conditionAmount) finalFeeTHB = 0; // ถ้ายอดเกินก็ส่งฟรี
                    } 
                    // กรณีปกติ ยอดรวมเกินยอดขั้นต่ำ = ส่งฟรี
                    else if (subtotalTHB >= conditionAmount) {
                        finalFeeTHB = 0; 
                    }
                }
            }

            document.getElementById('ship-fee').innerText = formatPrice(finalFeeTHB);
            document.getElementById('grand-total').innerText = formatPrice(subtotalTHB + finalFeeTHB);
        }

        // --- ส่วนควบคุม Modal พื้นฐาน ---
        function openProductModal(nameKey) {
            const group = globalGroupedProducts[nameKey];
            if(!group) return;
            document.getElementById('modal-name').innerText = group.name;
            document.getElementById('modal-price').innerText = formatPrice(group.price);
            document.getElementById('modal-price').setAttribute('data-thb', group.price);
            document.getElementById('modal-img').src = group.image || 'https://via.placeholder.com/400';
            
            const descBox = document.getElementById('modal-desc-box');
            if(group.descImage) {
                document.getElementById('modal-desc-img').src = group.descImage;
                descBox.classList.remove('hidden');
            } else descBox.classList.add('hidden');

            document.getElementById('modal-color').innerHTML = Array.from(group.colors).map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('modal-size').innerHTML = Array.from(group.sizes).map(s => `<option value="${s}">${s}</option>`).join('');
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        // Sidebar Controls
        document.getElementById('menu-btn').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('overlay').classList.remove('hidden'); });
        const closeSidebar = () => { document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('overlay').classList.add('hidden'); };
        document.getElementById('close-btn').addEventListener('click', closeSidebar);
        document.getElementById('overlay').addEventListener('click', closeSidebar);
        document.getElementById('shop-dropdown-btn').addEventListener('click', () => { document.getElementById('shop-submenu').classList.toggle('hidden'); });

        // เริ่มทำงาน
        initApp();
    </script>
</body>
</html>
