<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turning Turtle Store - Retro Edition</title>
    <style>
        body { font-family: 'MS Sans Serif', Tahoma, Geneva, sans-serif; padding: 20px; background: #008080; color: #000; margin: 0; padding-top: 80px; }
        
        /* Sticky Header */
        .top-header { position: fixed; top: 0; left: 0; width: 100%; background: #c0c0c0; border-bottom: 3px solid; border-color: #fff #000 #000 #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .brand-container { display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; text-decoration: none; color: inherit; }
        .turtle-container { display: flex; gap: 3px; animation: wiggle 1s infinite alternate; }
        @keyframes wiggle { 0% { transform: rotate(-10deg); } 100% { transform: rotate(10deg); } }
        
        /* Menu & Icons */
        .sidebar { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: #c0c0c0; border-right: 3px solid #000; z-index: 1000; transition: left 0.3s; padding-top: 70px; }
        .sidebar.open { left: 0; }
        .icon-btn { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 5px 10px; cursor: pointer; }
        
        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .product-card { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 5px; position: relative; }
        .badge-new { position: absolute; top: 10px; right: 10px; background: #d10000; color: #fff; padding: 2px 5px; font-weight: bold; }
        .product-image { width: 100%; height: 200px; object-fit: cover; border: 2px inset #808080; }
        .btn-retro { background: #c0c0c0; border: 2px solid; border-color: #fff #000 #000 #fff; padding: 5px 10px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-header">
        <div class="header-left">
            <button class="icon-btn" onclick="toggleSidebar()">☰</button>
            <div class="brand-container" onclick="location.reload()">
                <div class="turtle-container">🙃🐢 🙃🐢 🙃🐢</div>
                <h1 style="margin:0; font-size: 1.2em;">Turning Turtle</h1>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="document.getElementById('search-bar').style.display='block'">🔍</button>
            <button class="icon-btn" onclick="openModal('cart-modal')">🛒</button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div style="padding: 10px; font-weight: bold; cursor: pointer;" onclick="toggleSidebar()">Close X</div>
        <ul style="list-style: none; padding: 0;">
            <li style="padding: 15px;" onclick="renderGrid(allProducts); toggleSidebar()">Shop All</li>
            <li style="padding: 15px;" onclick="filterNewIn(); toggleSidebar()">New In</li>
            <li style="padding: 15px;" onclick="filterCategory('Tops'); toggleSidebar()">Tops</li>
            <li style="padding: 15px;" onclick="filterCategory('Bottoms'); toggleSidebar()">Bottoms</li>
        </ul>
    </div>

    <!-- Search -->
    <div id="search-bar" style="display:none; text-align:center; margin-top:90px;">
        <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()">
    </div>

    <!-- Main Display -->
    <div id="main-content-area" class="product-grid"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxWJdQVK5lYiQsm5V_MDuXF3aF2s5RlPjeXxZpOXYO_XW_xnI17e818WCv4-rnziU0-0g/exec'; 
        let allProducts = [];

        async function loadProducts() {
            const res = await fetch(API_URL + '?action=getProducts');
            const result = await res.json();
            if (result.status === 'success') {
                allProducts = result.data;
                renderGrid(allProducts);
            }
        }

        function renderGrid(products) {
            const container = document.getElementById('main-content-area');
            container.innerHTML = products.map(p => `
                <div class="product-card">
                    ${isNewItem(p.dateAdded) ? '<div class="badge-new">NEW IN</div>' : ''}
                    <img src="${p.image}" class="product-image">
                    <h3>${p.name}</h3>
                    <p>฿${p.price}</p>
                    <button class="btn-retro" onclick="alert('Details for ${p.name}')">DETAILS</button>
                </div>
            `).join('');
        }

        function isNewItem(dateString) {
            if(!dateString) return false;
            return (new Date() - new Date(dateString)) / (1000 * 60 * 60 * 24) <= 90;
        }

        function filterNewIn() {
            renderGrid(allProducts.filter(p => isNewItem(p.dateAdded)));
        }

        function filterCategory(cat) {
            renderGrid(allProducts.filter(p => p.type === cat));
        }

        function handleSearch() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            renderGrid(allProducts.filter(p => p.name.toLowerCase().includes(kw)));
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        loadProducts();
    </script>
</body>
</html>
